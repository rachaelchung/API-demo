<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadenzas - Anthology</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav-buttons">
    <a href="search.html" class="nav-button">home</a>
  </div>
  
  <div class="gallery-wrapper">
    <div class="gallery-header">
      <h1>cadenzas</h1>
      <p class="subtitle">your collection of keepsakes</p>
      <p class="keepsake-count" id="keepsakeCount">0 keepsakes</p>
    </div>

    <div class="carousel-container">
      <button class="carousel-nav prev" id="prevBtn">‹</button>
      <div class="carousel-track" id="carouselTrack">
        <!-- Cards will be inserted here -->
      </div>
      <button class="carousel-nav next" id="nextBtn">›</button>
    </div>

    <div class="carousel-dots" id="carouselDots"></div>

    <div class="card-actions">
      <button class="action-button share-button" id="shareBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
        share
      </button>
      <button class="action-button delete-button" id="deleteBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        delete
      </button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const carouselTrack = document.getElementById('carouselTrack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dotsContainer = document.getElementById('carouselDots');
    const keepsakeCount = document.getElementById('keepsakeCount');
    const shareBtn = document.getElementById('shareBtn');
    const deleteBtn = document.getElementById('deleteBtn');

    let currentIndex = 0;
    let gallery = [];

    function loadGallery() {
      gallery = getGallery();
      
      if (gallery.length === 0) {
        showEmptyState();
        return;
      }

      keepsakeCount.textContent = `${gallery.length} keepsake${gallery.length === 1 ? '' : 's'}`;
      renderCards();
      renderDots();
      updateCarousel();
    }

    function showEmptyState() {
      carouselTrack.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">♪</div>
          <h3>your anthology is empty</h3>
          <p>search for songs and save your favorite lines</p>
        </div>
      `;
      keepsakeCount.textContent = '0 keepsakes';
      dotsContainer.innerHTML = '';
      document.querySelector('.card-actions').style.display = 'none';
    }

    function renderCards() {
      carouselTrack.innerHTML = gallery.map((keepsake, index) => `
        <div class="keepsake-card" data-index="${index}">
          <div class="card-inner">
            <div class="card-header">
              <div class="vinyl-icon">♫</div>
              <div class="song-info">
                <h2 class="song-title">${keepsake.song}</h2>
                <p class="artist-name">${keepsake.artist}</p>
              </div>
            </div>
            
            <div class="lyrics-container">
              ${keepsake.lines.map(line => `
                <p class="lyric-line">${line.text}</p>
              `).join('')}
            </div>
            
          </div>
        </div>
      `).join('');
    }

    function renderDots() {
      dotsContainer.innerHTML = gallery.map((_, index) => `
        <button class="dot ${index === 0 ? 'active' : ''}" data-index="${index}"></button>
      `).join('');

      document.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', (e) => {
          currentIndex = parseInt(e.target.dataset.index);
          updateCarousel();
        });
      });
    }

    function updateCarousel() {
      const cards = document.querySelectorAll('.keepsake-card');
      const dots = document.querySelectorAll('.dot');
      
      cards.forEach((card, index) => {
        card.classList.remove('active', 'prev', 'next');
        if (index === currentIndex) {
          card.classList.add('active');
        } else if (index === currentIndex - 1) {
          card.classList.add('prev');
        } else if (index === currentIndex + 1) {
          card.classList.add('next');
        }
      });

      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });

      // Update button states
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === gallery.length - 1;

      // Scroll to active card
      if (cards[currentIndex]) {
        cards[currentIndex].scrollIntoView({ 
          behavior: 'smooth', 
          block: 'nearest',
          inline: 'center'
        });
      }
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex >= 0) {
        currentIndex--;
        updateCarousel();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex <= gallery.length - 1) {
        currentIndex++;
        updateCarousel();
      }
    });

    shareBtn.addEventListener('click', async () => {
      const currentCard = document.querySelector('.keepsake-card.active');
      if (!currentCard) return;

      // Create a shareable image/screenshot
      try {
        // Fallback: copy to clipboard
        const text = `${gallery[currentIndex].lines.map(l => l.text).join('\n')}\n\n— ${gallery[currentIndex].song} by ${gallery[currentIndex].artist}`;
        await navigator.clipboard.writeText(text);
        showToast('Copied to clipboard!');
      } catch (err) {
        console.error('Share failed:', err);
      }
    });

    deleteBtn.addEventListener('click', () => {
      if (confirm('delete this keepsake?')) {
        deleteFromGallery(currentIndex);
        
        // Adjust current index if needed
        if (currentIndex >= gallery.length - 1 && currentIndex > 0) {
          currentIndex--;
        }
        
        loadGallery();
      }
    });

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentIndex > 0) {
        currentIndex--;
        updateCarousel();
      } else if (e.key === 'ArrowRight' && currentIndex < gallery.length - 1) {
        currentIndex++;
        updateCarousel();
      }
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;

    carouselTrack.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    });

    carouselTrack.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      if (touchEndX < touchStartX - 50 && currentIndex < gallery.length - 1) {
        currentIndex++;
        updateCarousel();
      }
      if (touchEndX > touchStartX + 50 && currentIndex > 0) {
        currentIndex--;
        updateCarousel();
      }
    }

    // Load gallery on page load
    loadGallery();
  </script>
</body>
</html>
