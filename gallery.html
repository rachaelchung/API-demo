<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadenzas - Anthology</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav-buttons">
    <a href="search.html" class="nav-button">home</a>
  </div>
  
  <div class="search-container">
    <div class="tape"></div>
    
    <h1>cadenzas</h1>
    <p class="subtitle">your collection of keepsakes</p>

    <div id="results"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    const resultsDiv = document.getElementById('results');

    function loadGallery() {
      const gallery = getGallery();
      
      if (gallery.length === 0) {
        resultsDiv.innerHTML = `
          <div style="text-align: center; padding: 60px 20px;">
            <div style="
              font-size: 6em; 
              margin-bottom: 20px; 
              opacity: 0.2;
              font-family: 'Libre Baskerville', serif;
              color: #8b6642;
            ">~</div>
            <h3 style="
              color: #8b7355; 
              margin-bottom: 10px; 
              font-family: 'Libre Baskerville', serif; 
              font-size: 1.5em;
            ">
              your anthology is empty
            </h3>
            <p style="
              color: #b5a08f; 
              font-style: italic;
              font-family: 'Courier Prime', monospace;
            ">
              search for songs and save your favorite lines
            </p>
          </div>
        `;
      } else {
        resultsDiv.innerHTML = `
          <h2 style="
            font-family: 'Libre Baskerville', serif; 
            color: #5a4a3a; 
            text-align: center; 
            margin-bottom: 10px;
            font-size: 2em;
          ">your anthology</h2>
          <p style="
            text-align: center; 
            color: #8b7355; 
            font-style: italic; 
            margin-bottom: 30px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
          ">${gallery.length} keepsake${gallery.length === 1 ? '' : 's'}</p>
          <div id="galleryGrid"></div>
        `;
        
        const galleryGrid = document.getElementById('galleryGrid');
        
        gallery.forEach((keepsake, index) => {
          const card = document.createElement('div');
          card.style.cssText = `
            background: #fffef9;
            border: 2px solid #8b6642;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0px rgba(139, 102, 66, 0.2);
          `;
          
          card.innerHTML = `
            <div style="margin-bottom: 15px;">
              <h3 style="
                font-family: 'Libre Baskerville', serif;
                color: #5a4a3a;
                margin-bottom: 5px;
                font-size: 1.3em;
              ">${keepsake.song}</h3>
              <p style="
                color: #8b7355; 
                font-style: italic; 
                font-size: 0.95em;
                font-family: 'Courier Prime', monospace;
              ">
                ${keepsake.artist}
              </p>
            </div>
            
            <div style="
              background: #f4ebe0;
              padding: 20px;
              border-left: 4px solid #cd997c;
            ">
              ${keepsake.lines.map(line => `
                <p style="
                  color: #5a4a3a;
                  line-height: 1.8;
                  margin: 8px 0;
                  font-size: 1.05em;
                  font-family: 'Courier Prime', monospace;
                ">${line.text}</p>
              `).join('')}
            </div>
            
            <div style="
              margin-top: 15px;
              display: flex;
              justify-content: space-between;
              align-items: center;
            ">
              <span style="
                font-size: 0.8em;
                color: #b5a08f;
                font-style: italic;
                font-family: 'Space Mono', monospace;
                letter-spacing: 1px;
              ">
                ${keepsake.hasTiming ? 'animated' : 'static'}
              </span>
              <button class="deleteButton" data-index="${index}" style="
                padding: 8px 16px;
                border: 2px solid #8b4a42;
                background: #fffef9;
                color: #8b4a42;
                font-family: 'Space Mono', monospace;
                font-weight: 700;
                cursor: pointer;
                font-size: 0.8em;
                transition: all 0.2s ease;
                box-shadow: 2px 2px 0px rgba(139, 74, 66, 0.2);
                letter-spacing: 1px;
              ">delete</button>
            </div>
          `;
          
          galleryGrid.appendChild(card);
        });
        
        document.querySelectorAll('.deleteButton').forEach(button => {
          button.addEventListener('click', (e) => {
            const index = parseInt(e.target.dataset.index);
            handleDelete(index);
          });
        });
      }
    }

    function handleDelete(index) {
      if (confirm('are you sure you want to delete this keepsake?')) {
        deleteFromGallery(index);
        loadGallery();
      }
    }

    // Load gallery on page load
    loadGallery();
  </script>
</body>
</html>
