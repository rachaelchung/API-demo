<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadenzas - Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="nav-buttons">
    <a href="gallery.html" class="nav-button">anthology</a>
  </div>
  
  <div class="search-container">
    <div class="tape"></div>
    
    <h1>cadenzas</h1>
    <p class="subtitle">you feel the way I do?</p>

    <form class="search-form" id="searchForm">
      <input 
        type="text" 
        id="trackInput" 
        placeholder="song title (e.g., Espresso)"
        required
      >
      <input 
        type="text" 
        id="artistInput" 
        placeholder="artist name (e.g., Sabrina Carpenter)"
        required
      >
      <button type="submit">search</button>
    </form>

    <div id="results"></div>
  </div>

  <script src="shared.js"></script>
  <script>
    const form = document.getElementById('searchForm');
    const resultsDiv = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const track = document.getElementById('trackInput').value.trim();
      const artist = document.getElementById('artistInput').value.trim();

      if (!track || !artist) return;

      resultsDiv.innerHTML = '<p class="loading">searching for your song</p>';

      try {
        const response = await fetch(
          `https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`
        );

        if (!response.ok) {
          throw new Error('Failed to fetch lyrics');
        }

        const results = await response.json();

        if (results.length === 0) {
          resultsDiv.innerHTML = '<p class="error">no lyrics found. try different search terms</p>';
          return;
        }

        displayResults(results);

        if (results[0].syncedLyrics) {
          console.log('Synced Lyrics for:', results[0].trackName);
          console.log('Raw LRC:', results[0].syncedLyrics);

          const parsed = parseLRC(results[0].syncedLyrics);
          console.log('Parsed Lyrics:', parsed);
          console.log(`Total lines: ${parsed.length}`);
        } else {
          console.log('No synced lyrics available for this track');
        }

      } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = '<p class="error">something went wrong. please try again</p>';
      }
    });

    function displayResults(results) {
      resultsDiv.innerHTML = '<h3>results</h3>';
      
      results.forEach((result, index) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        
        const hasLyrics = result.syncedLyrics ? true : false;
        const statusClass = hasLyrics ? 'has-lyrics' : 'no-lyrics';
        const statusText = hasLyrics ? 'synced' : 'plain text';
        
        card.innerHTML = `
          <div class="result-title">${result.trackName}</div>
          <div class="result-artist">${result.artistName}</div>
          <span class="result-status ${statusClass}">${statusText}</span>
        `;
        
        card.addEventListener('click', () => {
          if (result.syncedLyrics || result.plainLyrics) {
            displayLyricCard(result);
          }
        });
        
        resultsDiv.appendChild(card);
      });
    }

    function displayLyricCard(song) {
      const hasSyncedLyrics = song.syncedLyrics ? true : false;
      const lyrics = hasSyncedLyrics 
        ? parseLRC(song.syncedLyrics) 
        : song.plainLyrics.split('\n').map(text => ({ time: 0, text: text.trim() })).filter(l => l.text.length > 0);
      
      resultsDiv.innerHTML = `
        <div style="text-align: center; margin-bottom: 25px;">
          <h2 style="
            font-family: 'Libre Baskerville', serif; 
            color: #5a4a3a; 
            margin-bottom: 8px;
            font-size: 1.8em;
          ">
            ${song.trackName}
          </h2>
          <p style="
            color: #8b7355; 
            font-style: italic; 
            margin-bottom: 15px;
            font-family: 'Courier Prime', monospace;
          ">
            ${song.artistName}
          </p>
          <button id="backButton" style="
            padding: 10px 20px;
            border: 2px solid #8b6642;
            background: #fffef9;
            color: #5a4a3a;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85em;
            box-shadow: 3px 3px 0px rgba(139, 102, 66, 0.3);
            letter-spacing: 1px;
          ">back to search</button>
        </div>
        
        <div style="
          background: #f4ebe0;
          border: 2px solid #8b6642;
          padding: 25px;
          margin-bottom: 20px;
          box-shadow: 4px 4px 0px rgba(139, 102, 66, 0.2);
        ">
          <p style="
            text-align: center; 
            color: #8b7355; 
            font-size: 0.9em; 
            margin-bottom: 15px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 1px;
          ">
            click on lines to select them for your anthology
          </p>
          <div id="lyricsContainer" style="
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
          "></div>
        </div>
        
        <div style="text-align: center;">
          <button id="saveButton" style="
            padding: 15px 35px;
            border: 3px solid #8b6642;
            background: #cd997c;
            color: #fffef9;
            font-size: 1em;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            box-shadow: 5px 5px 0px rgba(139, 102, 66, 0.4);
            opacity: 0.5;
            pointer-events: none;
            letter-spacing: 2px;
          ">save (<span id="selectedCount">0</span>)</button>
        </div>
      `;
      
      const container = document.getElementById('lyricsContainer');
      const saveButton = document.getElementById('saveButton');
      const selectedCount = document.getElementById('selectedCount');
      
      let selectedLines = [];
      
      lyrics.forEach((lyric, index) => {
        const lyricLine = document.createElement('div');
        lyricLine.className = 'lyric-line-selectable';
        lyricLine.dataset.time = lyric.time;
        lyricLine.dataset.index = index;
        lyricLine.textContent = lyric.text;
        lyricLine.style.cssText = `
          padding: 14px 18px;
          margin: 8px 0;
          font-size: 1.05em;
          color: #5a4a3a;
          background: #fffef9;
          border: 2px solid #b5a08f;
          cursor: pointer;
          transition: all 0.2s ease;
          line-height: 1.7;
          user-select: none;
          font-family: 'Courier Prime', monospace;
          box-shadow: 2px 2px 0px rgba(139, 102, 66, 0.15);
        `;
        
        lyricLine.addEventListener('click', () => {
          const isSelected = lyricLine.classList.contains('selected');
          
          if (isSelected) {
            lyricLine.classList.remove('selected');
            lyricLine.style.background = '#fffef9';
            lyricLine.style.borderColor = '#b5a08f';
            lyricLine.style.color = '#5a4a3a';
            lyricLine.style.transform = 'none';
            lyricLine.style.boxShadow = '2px 2px 0px rgba(139, 102, 66, 0.15)';
            
            selectedLines = selectedLines.filter(l => l.index !== index);
          } else {
            lyricLine.classList.add('selected');
            lyricLine.style.background = '#cd997c';
            lyricLine.style.borderColor = '#8b6642';
            lyricLine.style.color = '#fffef9';
            lyricLine.style.transform = 'translate(-2px, -2px)';
            lyricLine.style.boxShadow = '4px 4px 0px rgba(139, 102, 66, 0.3)';
            
            selectedLines.push({
              index: index,
              text: lyric.text,
              time: lyric.time
            });
          }
          
          selectedCount.textContent = selectedLines.length;
          
          if (selectedLines.length > 0) {
            saveButton.style.opacity = '1';
            saveButton.style.pointerEvents = 'auto';
          } else {
            saveButton.style.opacity = '0.5';
            saveButton.style.pointerEvents = 'none';
          }
        });
        
        container.appendChild(lyricLine);
      });
      
      document.getElementById('backButton').addEventListener('click', () => {
        location.reload();
      });
      
      saveButton.addEventListener('click', () => {
        if (selectedLines.length > 0) {
          saveToGallery({
            song: song.trackName,
            artist: song.artistName,
            lines: selectedLines,
            hasTiming: hasSyncedLyrics,
            savedAt: new Date().toISOString()
          });
          
          alert(`saved ${selectedLines.length} line(s) to your anthology`);
          location.reload();
        }
      });
    }
  </script>
</body>
</html>
