<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadenzas - Search</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Karla:wght@400;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Karla', sans-serif;
      background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #ff7675 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .search-container {
      max-width: 550px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 30px;
      padding: 50px 40px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.15),
        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      text-align: center;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 4em;
      margin-bottom: 0.1em;
      background: linear-gradient(135deg, #fd79a8, #a29bfe, #74b9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .subtitle {
      font-style: italic;
      color: #636e72;
      margin-bottom: 2.5em;
      font-size: 1.05em;
    }

    .search-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    input {
      padding: 18px 22px;
      border: 3px solid #dfe6e9;
      border-radius: 50px;
      background: white;
      color: #2d3436;
      font-size: 1em;
      font-family: 'Karla', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #b2bec3;
    }

    input:focus {
      border-color: #a29bfe;
      box-shadow: 0 0 0 4px rgba(162, 155, 254, 0.15);
      transform: translateY(-2px);
    }

    button {
      padding: 18px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #fd79a8 0%, #a29bfe 100%);
      color: white;
      font-size: 1.1em;
      font-weight: 700;
      font-family: 'Karla', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(253, 121, 168, 0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(253, 121, 168, 0.4);
    }

    button:active {
      transform: translateY(-1px);
    }

    .results {
      margin-top: 35px;
      text-align: left;
    }

    .results h3 {
      color: #636e72;
      font-family: 'Karla', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85em;
      margin-bottom: 20px;
      text-align: center;
    }

    .result-card {
      background: linear-gradient(135deg, #fff5f7 0%, #f0f3ff 100%);
      border: 2px solid #dfe6e9;
      border-radius: 20px;
      padding: 22px 25px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(162, 155, 254, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .result-card:hover::before {
      left: 100%;
    }

    .result-card:hover {
      border-color: #a29bfe;
      transform: translateX(8px) translateY(-2px);
      box-shadow: -8px 8px 0px rgba(162, 155, 254, 0.2);
    }

    .result-title {
      font-weight: 700;
      font-size: 1.25em;
      margin-bottom: 6px;
      color: #2d3436;
    }

    .result-artist {
      color: #636e72;
      font-style: italic;
      margin-bottom: 10px;
    }

    .result-status {
      display: inline-block;
      font-size: 0.85em;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      margin-top: 8px;
    }

    .has-lyrics {
      background: linear-gradient(135deg, #55efc4, #81ecec);
      color: #00b894;
    }

    .no-lyrics {
      background: #dfe6e9;
      color: #636e72;
    }

    .loading {
      text-align: center;
      color: #636e72;
      font-style: italic;
      padding: 30px;
      font-size: 1.1em;
    }

    .loading::after {
      content: '...';
      animation: ellipsis 1.5s infinite;
    }

    @keyframes ellipsis {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .error {
      color: #d63031;
      text-align: center;
      padding: 25px;
      background: linear-gradient(135deg, #fff0f0, #ffe0e0);
      border: 2px solid #ff7675;
      border-radius: 20px;
      font-weight: 700;
    }

    /* Cute decorative elements */
    .search-container::before {
      content: '♪';
      position: absolute;
      top: -15px;
      left: 30px;
      font-size: 3em;
      opacity: 0.3;
      color: #fd79a8;
    }

    .search-container::after {
      content: '♫';
      position: absolute;
      bottom: -10px;
      right: 40px;
      font-size: 2.5em;
      opacity: 0.3;
      color: #a29bfe;
    }

    .search-container {
      position: relative;
    }

    .lyric-line.active {
      color: #fd79a8 !important;
      font-weight: 700;
      transform: scale(1.05);
      text-shadow: 0 0 20px rgba(253, 121, 168, 0.4);
    }
  </style>
</head>
<body>
  <div class="search-container">
    <div style="position: absolute; top: 25px; right: 25px; display: flex; gap: 10px;">
      <button id="homeButton" style="
        padding: 10px 18px;
        border: 2px solid #dfe6e9;
        border-radius: 20px;
        background: white;
        color: #636e72;
        font-family: 'Karla', sans-serif;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.9em;
        display: none;
      ">🏠 Home</button>
      <button id="galleryButton" style="
        padding: 10px 18px;
        border: 2px solid #dfe6e9;
        border-radius: 20px;
        background: white;
        color: #636e72;
        font-family: 'Karla', sans-serif;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.9em;
      ">✨ Gallery</button>
    </div>
    
    <h1>cadenzas</h1>
    <p class="subtitle">collect the music that stays with you</p>

    <form class="search-form" id="searchForm">
      <input 
        type="text" 
        id="trackInput" 
        placeholder="song title (e.g., Wonderwall)"
        required
      >
      <input 
        type="text" 
        id="artistInput" 
        placeholder="artist name (e.g., Oasis)"
        required
      >
      <button type="submit">Search</button>
    </form>

    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const resultsDiv = document.getElementById('results');
    const homeButton = document.getElementById('homeButton');
    const galleryButton = document.getElementById('galleryButton');

    // Navigation handlers
    homeButton.addEventListener('click', () => {
      showHomeView();
    });

    galleryButton.addEventListener('click', () => {
      showGalleryView();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const track = document.getElementById('trackInput').value.trim();
      const artist = document.getElementById('artistInput').value.trim();

      if (!track || !artist) return;

      resultsDiv.innerHTML = '<p class="loading">Searching for your song</p>';

      try {
        const response = await fetch(
          `https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`
        );

        if (!response.ok) {
          throw new Error('Failed to fetch lyrics');
        }

        const results = await response.json();

        if (results.length === 0) {
          resultsDiv.innerHTML = '<p class="error">No lyrics found. Try different search terms!</p>';
          return;
        }

        displayResults(results);

        if (results[0].syncedLyrics) {
          console.log('Synced Lyrics for:', results[0].trackName);
          console.log('Raw LRC:', results[0].syncedLyrics);

          const parsed = parseLRC(results[0].syncedLyrics);
          console.log('Parsed Lyrics:', parsed);
          console.log(`Total lines: ${parsed.length}`);
        } else {
          console.log('No synced lyrics available for this track');
        }

      } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = '<p class="error">Something went wrong. Please try again!</p>';
      }
    });

    function displayResults(results) {
      resultsDiv.innerHTML = '<h3>Results</h3>';
      
      results.forEach((result, index) => {
        const card = document.createElement('div');
        card.className = 'result-card';
        
        const hasLyrics = result.syncedLyrics ? true : false;
        const statusClass = hasLyrics ? 'has-lyrics' : 'no-lyrics';
        const statusText = hasLyrics ? '✨ has synced lyrics' : '♪ plain lyrics only';
        
        card.innerHTML = `
          <div class="result-title">${result.trackName}</div>
          <div class="result-artist">${result.artistName}</div>
          <span class="result-status ${statusClass}">${statusText}</span>
        `;
        
        card.addEventListener('click', () => {
          if (result.syncedLyrics) {
            displayLyricCard(result);
          }
        });
        
        resultsDiv.appendChild(card);
      });
    }

    function parseLRC(lrcString) {
      // Split the string into lines
      const lines = lrcString.split('\n');
      
      // Array to store our parsed lyrics
      const parsedLyrics = [];
      
      // Regular expression to match timestamp pattern [MM:SS.MS]
      const timeRegex = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
      
      lines.forEach(line => {
        // Try to match the timestamp pattern
        const match = line.match(timeRegex);
        
        if (match) {
          // Extract minutes, seconds, and milliseconds
          const minutes = parseInt(match[1]);
          const seconds = parseInt(match[2]);
          const milliseconds = parseInt(match[3]);
          
          // Convert everything to total seconds
          const totalSeconds = minutes * 60 + seconds + milliseconds / 100;
          
          // Get the text after the timestamp
          const text = line.replace(timeRegex, '').trim();
          
          // Only add if there's actual text (filter out empty lines)
          if (text.length > 0) {
            parsedLyrics.push({
              time: totalSeconds,
              text: text
            });
          }
        }
      });
      
      return parsedLyrics;
    }

    function displayLyricCard(song) {
      // Check if we have synced or plain lyrics
      const hasSyncedLyrics = song.syncedLyrics ? true : false;
      const lyrics = hasSyncedLyrics 
        ? parseLRC(song.syncedLyrics) 
        : song.plainLyrics.split('\n').map(text => ({ time: 0, text: text.trim() })).filter(l => l.text.length > 0);
      
      // Clear the results and show the lyric picker
      resultsDiv.innerHTML = `
        <div style="text-align: center; margin-bottom: 25px;">
          <h2 style="font-family: 'DM Serif Display', serif; color: #2d3436; margin-bottom: 8px;">
            ${song.trackName}
          </h2>
          <p style="color: #636e72; font-style: italic; margin-bottom: 15px;">
            ${song.artistName}
          </p>
          <button id="backButton" style="
            padding: 10px 20px;
            border: 2px solid #dfe6e9;
            border-radius: 20px;
            background: white;
            color: #636e72;
            font-family: 'Karla', sans-serif;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9em;
          ">← Back to Search</button>
        </div>
        
        <div style="
          background: linear-gradient(135deg, #fff5f7 0%, #f0f3ff 100%);
          border: 2px solid #dfe6e9;
          border-radius: 20px;
          padding: 25px;
          margin-bottom: 20px;
        ">
          <p style="text-align: center; color: #636e72; font-size: 0.95em; margin-bottom: 15px;">
            ✨ Click on lines to select them for your gallery
          </p>
          <div id="lyricsContainer" style="
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
          "></div>
        </div>
        
        <div style="text-align: center;">
          <button id="saveButton" style="
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #fd79a8 0%, #a29bfe 100%);
            color: white;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Karla', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(253, 121, 168, 0.3);
            opacity: 0.5;
            pointer-events: none;
          ">Save Selected Lines (<span id="selectedCount">0</span>)</button>
        </div>
      `;
      
      // Display all the lyrics as selectable lines
      const container = document.getElementById('lyricsContainer');
      const saveButton = document.getElementById('saveButton');
      const selectedCount = document.getElementById('selectedCount');
      
      let selectedLines = [];
      
      lyrics.forEach((lyric, index) => {
        const lyricLine = document.createElement('div');
        lyricLine.className = 'lyric-line-selectable';
        lyricLine.dataset.time = lyric.time;
        lyricLine.dataset.index = index;
        lyricLine.textContent = lyric.text;
        lyricLine.style.cssText = `
          padding: 14px 18px;
          margin: 6px 0;
          font-size: 1.15em;
          color: #2d3436;
          background: white;
          border: 2px solid #dfe6e9;
          border-radius: 15px;
          cursor: pointer;
          transition: all 0.3s ease;
          line-height: 1.6;
          user-select: none;
        `;
        
        // Click to toggle selection
        lyricLine.addEventListener('click', () => {
          const isSelected = lyricLine.classList.contains('selected');
          
          if (isSelected) {
            // Deselect
            lyricLine.classList.remove('selected');
            lyricLine.style.background = 'white';
            lyricLine.style.borderColor = '#dfe6e9';
            lyricLine.style.color = '#2d3436';
            lyricLine.style.transform = 'scale(1)';
            
            // Remove from selected array
            selectedLines = selectedLines.filter(l => l.index !== index);
          } else {
            // Select
            lyricLine.classList.add('selected');
            lyricLine.style.background = 'linear-gradient(135deg, #fd79a8 0%, #a29bfe 100%)';
            lyricLine.style.borderColor = '#fd79a8';
            lyricLine.style.color = 'white';
            lyricLine.style.transform = 'scale(1.02)';
            lyricLine.style.boxShadow = '0 4px 15px rgba(253, 121, 168, 0.3)';
            
            // Add to selected array
            selectedLines.push({
              index: index,
              text: lyric.text,
              time: lyric.time
            });
          }
          
          // Update button state
          selectedCount.textContent = selectedLines.length;
          
          if (selectedLines.length > 0) {
            saveButton.style.opacity = '1';
            saveButton.style.pointerEvents = 'auto';
          } else {
            saveButton.style.opacity = '0.5';
            saveButton.style.pointerEvents = 'none';
          }
        });
        
        container.appendChild(lyricLine);
      });
      
      // Add back button functionality
      document.getElementById('backButton').addEventListener('click', () => {
        location.reload();
      });
      
      // Add save button functionality
      saveButton.addEventListener('click', () => {
        if (selectedLines.length > 0) {
          saveToGallery({
            song: song.trackName,
            artist: song.artistName,
            lines: selectedLines,
            hasTiming: hasSyncedLyrics,
            savedAt: new Date().toISOString()
          });
          
          alert(`✨ Saved ${selectedLines.length} line(s) to your gallery!`);
          location.reload();
        }
      });
    }

    function startGhostKaraoke(lyrics) {
      const container = document.getElementById('lyricsContainer');
      const playButton = document.getElementById('playButton');
      
      // State variables
      let startTime = null;
      let animationId = null;
      let currentIndex = 0;
      let pausedTime = 0;
      let isPaused = false;
      let isFinished = false;
      
      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        
        const elapsedSeconds = (timestamp - startTime) / 1000 + pausedTime;
        
        if (currentIndex < lyrics.length) {
          const currentLyric = lyrics[currentIndex];
          
          if (elapsedSeconds >= currentLyric.time) {
            document.querySelectorAll('.lyric-line').forEach(line => {
              line.classList.remove('active');
            });
            
            const currentLine = container.querySelector(`[data-index="${currentIndex}"]`);
            if (currentLine) {
              currentLine.classList.add('active');
              currentLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            currentIndex++;
          }
        }
        
        if (currentIndex < lyrics.length) {
          animationId = requestAnimationFrame(animate);
        } else {
          // Animation finished
          isFinished = true;
          playButton.textContent = '↻ Replay';
          playButton.style.background = 'linear-gradient(135deg, #fd79a8 0%, #a29bfe 100%)';
        }
      }
      
      // Set up the button handler ONCE
      playButton.onclick = () => {
        if (isFinished) {
          // REPLAY from beginning
          currentIndex = 0;
          startTime = null;
          pausedTime = 0;
          isPaused = false;
          isFinished = false;
          
          document.querySelectorAll('.lyric-line').forEach(line => {
            line.classList.remove('active');
          });
          container.scrollTop = 0;
          
          playButton.textContent = '⏸ Pause';
          playButton.style.background = 'linear-gradient(135deg, #ff7675 0%, #d63031 100%)';
          animationId = requestAnimationFrame(animate);
          
        } else if (!isPaused) {
          // PAUSE
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }
          isPaused = true;
          
          const now = performance.now();
          if (startTime) {
            pausedTime = (now - startTime) / 1000 + pausedTime;
          }
          startTime = null;
          
          playButton.textContent = '▶ Resume';
          playButton.style.background = 'linear-gradient(135deg, #55efc4 0%, #00b894 100%)';
          
        } else {
          // RESUME
          isPaused = false;
          startTime = null;
          playButton.textContent = '⏸ Pause';
          playButton.style.background = 'linear-gradient(135deg, #ff7675 0%, #d63031 100%)';
          animationId = requestAnimationFrame(animate);
        }
      };
      
      // Start the animation immediately
      playButton.textContent = '⏸ Pause';
      playButton.style.background = 'linear-gradient(135deg, #ff7675 0%, #d63031 100%)';
      animationId = requestAnimationFrame(animate);
    }

    function saveToGallery(keepsake) {
      // Get existing gallery from localStorage
      let gallery = localStorage.getItem('cadenzas_gallery');
      
      if (gallery) {
        gallery = JSON.parse(gallery);
      } else {
        gallery = [];
      }
      
      // Add the new keepsake
      gallery.push(keepsake);
      
      // Save back to localStorage
      localStorage.setItem('cadenzas_gallery', JSON.stringify(gallery));
      
      console.log('Saved to gallery:', keepsake);
      console.log('Total items in gallery:', gallery.length);
    }

    function showHomeView() {
      // Show the search form
      document.getElementById('searchForm').style.display = 'flex';
      
      // Clear results
      resultsDiv.innerHTML = '';
      
      // Toggle navigation buttons
      homeButton.style.display = 'none';
      galleryButton.style.display = 'block';
    }

    function showGalleryView() {
      // Hide the search form
      document.getElementById('searchForm').style.display = 'none';
      
      // Toggle navigation buttons
      homeButton.style.display = 'block';
      galleryButton.style.display = 'none';
      
      // Get gallery data from localStorage
      let gallery = localStorage.getItem('cadenzas_gallery');
      
      if (gallery) {
        gallery = JSON.parse(gallery);
      } else {
        gallery = [];
      }
      
      // Display the gallery
      if (gallery.length === 0) {
        resultsDiv.innerHTML = `
          <div style="text-align: center; padding: 60px 20px;">
            <div style="font-size: 4em; margin-bottom: 20px; opacity: 0.3;">♪</div>
            <h3 style="color: #636e72; margin-bottom: 10px; font-family: 'DM Serif Display', serif; font-size: 1.5em;">
              Your gallery is empty
            </h3>
            <p style="color: #b2bec3; font-style: italic;">
              Search for songs and save your favorite lines to build your collection
            </p>
          </div>
        `;
      } else {
        resultsDiv.innerHTML = `
          <h2 style="
            font-family: 'DM Serif Display', serif; 
            color: #2d3436; 
            text-align: center; 
            margin-bottom: 10px;
            font-size: 2em;
          ">Your Gallery</h2>
          <p style="
            text-align: center; 
            color: #636e72; 
            font-style: italic; 
            margin-bottom: 30px;
          ">${gallery.length} keepsake${gallery.length === 1 ? '' : 's'}</p>
          <div id="galleryGrid"></div>
        `;
        
        const galleryGrid = document.getElementById('galleryGrid');
        
        // Display each keepsake as a card
        gallery.forEach((keepsake, index) => {
          const card = document.createElement('div');
          card.style.cssText = `
            background: linear-gradient(135deg, #fff5f7 0%, #f0f3ff 100%);
            border: 2px solid #dfe6e9;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
          `;
          
          card.innerHTML = `
            <div style="margin-bottom: 15px;">
              <h3 style="
                font-family: 'DM Serif Display', serif;
                color: #2d3436;
                margin-bottom: 5px;
                font-size: 1.3em;
              ">${keepsake.song}</h3>
              <p style="color: #636e72; font-style: italic; font-size: 0.95em;">
                ${keepsake.artist}
              </p>
            </div>
            
            <div style="
              background: white;
              border-radius: 15px;
              padding: 20px;
              border-left: 4px solid #fd79a8;
            ">
              ${keepsake.lines.map(line => `
                <p style="
                  color: #2d3436;
                  line-height: 1.8;
                  margin: 8px 0;
                  font-size: 1.05em;
                ">${line.text}</p>
              `).join('')}
            </div>
            
            <div style="
              margin-top: 15px;
              display: flex;
              justify-content: space-between;
              align-items: center;
            ">
              <span style="
                font-size: 0.85em;
                color: #b2bec3;
                font-style: italic;
              ">
                ${keepsake.hasTiming ? '✨ Animated' : '♪ Static'}
              </span>
              <button class="deleteButton" data-index="${index}" style="
                padding: 8px 16px;
                border: 2px solid #ff7675;
                border-radius: 15px;
                background: white;
                color: #ff7675;
                font-family: 'Karla', sans-serif;
                font-weight: 700;
                cursor: pointer;
                font-size: 0.85em;
                transition: all 0.3s ease;
              ">Delete</button>
            </div>
          `;
          
          galleryGrid.appendChild(card);
        });
        
        // Add delete functionality
        document.querySelectorAll('.deleteButton').forEach(button => {
          button.addEventListener('click', (e) => {
            const index = parseInt(e.target.dataset.index);
            deleteFromGallery(index);
          });
        });
      }
    }

    function deleteFromGallery(index) {
      if (confirm('Are you sure you want to delete this keepsake?')) {
        let gallery = JSON.parse(localStorage.getItem('cadenzas_gallery'));
        gallery.splice(index, 1);
        localStorage.setItem('cadenzas_gallery', JSON.stringify(gallery));
        
        // Refresh the gallery view
        showGalleryView();
      }
    }
  </script>
